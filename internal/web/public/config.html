<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>懒猫关灯 - 配置</title>
    <link rel="stylesheet" href="/static/css/normalize-5.0.0.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 添加图标库 -->
    <link rel="stylesheet" href="/static/css/remixicon.css">
</head>
<body>
    <!-- 动效背景容器 -->
    <div class="background-container">
        <div class="background-1"></div>
        <div class="background-2"></div>
    </div>
    
    <div id="app">
        <!-- 顶部导航栏 -->
        <header class="app-header">
            <div class="header-title">配置</div>
            <div class="header-actions">
                <button id="theme-toggle" aria-label="切换主题">
                    <!-- 暗色主题图标 -->
                    <svg id="dark-icon" t="1755228574750" class="icon theme-icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="9349" width="24" height="24" style="display: none;">
                        <path d="M512 832c-179.2 0-320-140.8-320-320s140.8-320 320-320 320 140.8 320 320S691.2 832 512 832M512 896c211.2 0 384-172.8 384-384s-172.8-384-384-384S128 300.8 128 512 300.8 896 512 896L512 896zM800 512c0-160-128-288-288-288l0 576C672 800 800 672 800 512zM480 608 243.2 608C249.6 620.8 256 640 262.4 652.8l217.6 0L480 608zM480 416 480 371.2 262.4 371.2C256 384 249.6 403.2 243.2 416L480 416zM480 300.8 480 256 384 256C358.4 268.8 339.2 281.6 320 300.8 320 300.8zM224 537.6l256 0L480 492.8l-256 0c0 6.4 0 12.8 0 19.2S224 524.8 224 537.6zM480 723.2 320 723.2c19.2 19.2 38.4 32 64 44.8l96 0L480 723.2z" fill="currentColor" p-id="9350"></path>
                    </svg>
                    <!-- 明亮主题图标 -->
                    <svg id="light-icon" t="1755228625494" class="icon theme-icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="10333" width="24" height="24" style="display: none;">
                        <path d="M512 192c179.2 0 320 140.8 320 320s-140.8 320-320 320-320-140.8-320-320S332.8 192 512 192M512 128C300.8 128 128 300.8 128 512s172.8 384 384 384 384-172.8 384-384S723.2 128 512 128L512 128z" fill="currentColor" p-id="10334"></path>
                        <path d="M544 416l236.8 0C774.4 403.2 768 384 761.6 371.2L544 371.2 544 416z" fill="currentColor" p-id="10335"></path>
                        <path d="M544 608l0 44.8 217.6 0c6.4-12.8 12.8-32 19.2-44.8L544 608z" fill="currentColor" p-id="10336"></path>
                        <path d="M544 723.2 544 768 640 768c25.6-12.8 44.8-25.6 64-44.8L544 723.2z" fill="currentColor" p-id="10337"></path>
                        <path d="M800 492.8l-256 0 0 44.8 256 0c0-6.4 0-12.8 0-25.6S800 499.2 800 492.8z" fill="currentColor" p-id="10338"></path>
                        <path d="M544 300.8 704 300.8c-19.2-19.2-38.4-32-64-44.8L544 256 544 300.8z" fill="currentColor" p-id="10339"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 配置表单 -->
        <section class="config-section">
            <h2 class="section-title">Server酱配置</h2>
            <div class="config-form-container">
                <form id="serverchan-config-form">
                    <div class="form-group toggle-group">
                        <label for="serverchan-enabled">启用Server酱通知</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="serverchan-enabled">
                            <label for="serverchan-enabled" class="toggle-label"></label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="send-key">SendKey</label>
                        <input type="text" id="send-key" placeholder="请输入Server酱的SendKey" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="on-template">开灯通知模板</label>
                        <textarea id="on-template" placeholder="请输入开灯通知模板" rows="3"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="off-template">关灯通知模板</label>
                        <textarea id="off-template" placeholder="请输入关灯通知模板" rows="3"></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="primary-button" id="save-config-btn">保存配置</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- 返回主页链接 -->
        <section class="back-section">
            <a href="/" class="back-link">
                <i class="ri-arrow-left-line"></i>
                返回主页
            </a>
        </section>
    </div>

    <!-- Toast通知容器 -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/js/config.js"></script>
</body>
</html>
