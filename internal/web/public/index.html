            <!-- 用户信息区域 -->
            <section class="user-info-section">
                <div class="user-profile">
                    <div class="user-avatar">
                        <i
                            class="ri-user-3-line"
                            aria-hidden="true"
                            role="img"
                            aria-label="用户头像"
                        ></i>
                    </div>
                    <div class="user-details">
                        <div class="user-name">加载中…</div>
                        <div class="user-role">角色: 加载中…</div>
                    </div>
                    <div class="user-actions">
                        <button
                            id="logout-btn"
                            aria-label="登出"
                            title="退出登录"
                            class="logout-button"
                        >
                            <i class="ri-logout-circle-r-line"></i>
                            <span>退出</span>
                        </button>
                    </div>
                </div>
                <div class="device-info">
                    <div class="device-id">设备ID: 加载中…</div>
                    <div class="device-version">版本: 加载中…</div>
                </div>
            </section>

            <!-- LED当前状态展示 -->

                <!-- 经典灯泡样式 -->
                <div class="bulb-container bulb-classic active">
                    <div class="switch">
                        <input type="checkbox" name="toggle" id="led-toggle" />
                        <label for="led-toggle">
                            <i class="bulb">
                                <span class="bulb-center"></span>
                                <span class="filament-1"></span>
                                <span class="filament-2"></span>
                                <span class="reflections">
                                    <span></span>
                                </span>
                                <span class="sparks">
                                    <i class="spark1"></i>
                                    <i class="spark2"></i>
                                    <i class="spark3"></i>
                                    <i class="spark4"></i>
                                </span>
                            </i>
                        </label>
                    </div>
                </div>

                    class="bulb-container bulb-lava"
                    role="button"
                    tabindex="0"
                    aria-label="熔岩灯开关"

                    <div class="frame-lava">
                        <div class="top-lava"></div>
                        <div class="body-lamp">

                                <div class="bubble"></div>
                                <div class="bubble"></div>
                                <div class="bubble"></div>
                                <div class="bubble"></div>
                                <div class="bubble"></div>
                            </div>
                        </div>
                        <div class="base-lamp"></div>
                        <div class="base-lava"></div>
                    </div>
                </div>

                                        <feMergeNode in="coloredBlur"></feMergeNode>
                                        <feMergeNode in="SourceGraphic"></feMergeNode>
                                    </feMerge>
                                </filter>
                                <linearGradient id="neon-switch-gradient1" x1="0" y1="0" x2="1" y2="0">
                                    <stop offset="0%" stop-color="hsl(var(--neon-on-hue1),90%,70%)" />
                                    <stop offset="100%" stop-color="hsl(var(--neon-on-hue2),90%,70%)" />
                                </linearGradient>
                                <linearGradient id="neon-switch-gradient2" x1="0.7" y1="0" x2="0.3" y2="1">
                                    <stop offset="25%" stop-color="hsla(var(--neon-on-hue1),90%,70%,0)" />
                                    <stop offset="50%" stop-color="hsla(var(--neon-on-hue1),90%,70%,0.3)" />
                                    <stop offset="100%" stop-color="hsla(var(--neon-on-hue2),90%,70%,0.3)" />
                                </linearGradient>
                            </defs>
                            <path fill="none" filter="url(#neon-switch-glow)" stroke="url(#neon-switch-gradient1)" stroke-width="1" stroke-dasharray="0 104.26 0" stroke-dashoffset="0.01" stroke-linecap="round" d="m.5,12C.5,5.649,5.649.5,12,.5h16c6.351,0,11.5,5.149,11.5,11.5s-5.149,11.5-11.5,11.5H12C5.649,23.5.5,18.351.5,12Z"/>
                        </svg>
                        <span class="neon-switch__knob-shadow"></span>
                        <span class="neon-switch__knob-container">
                            <span class="neon-switch__knob">
                                <svg class="neon-switch__knob-neon" viewBox="0 0 48 48" width="48px" height="48px">
                                    <circle fill="none" stroke="url(#neon-switch-gradient2)" stroke-dasharray="0 90.32 0 54.19" stroke-linecap="round" stroke-width="1" r="23" cx="24" cy="24" transform="rotate(-112.5,24,24)" />
                                </svg>
                            </span>
                        </span>
                        <span class="neon-switch__led"></span>
                    </label>
                </div>

                <!-- Fox Day-Night 样式 -->
                <div
                    class="bulb-container bulb-fox-daynight"
                    role="button"
                    tabindex="0"
                    aria-label="狐狸日夜灯开关"
                >
                    <div class="fox-container">
                        <input type="checkbox" id="fox-toggle" />
                        <label for="fox-toggle" aria-label="日夜切换"></label>

                        <div class="fox-day-night-cont">
                            <span class="fox-sun-indicator" aria-hidden="true"></span>
                            <div class="fox-moon-indicator" aria-hidden="true">
                                <span class="fox-moon-inside"></span>
                            </div>
                        </div>

                        <div class="fox-switch">
                            <div class="fox-button">
                                <div class="fox-b-inside"></div>
                            </div>
                        </div>

                        <div class="fox-window">
                            <span class="fox-sun" aria-hidden="true"></span>
                            <span class="fox-moon" aria-hidden="true"></span>

                            <div class="the-fox">
                                <div class="fox-face">
                                    <div class="fox-eyes left"></div>
                                    <div class="fox-eyes right"></div>
                                    <span class="fox-nose"></span>
                                    <div class="fox-white-part">
                                        <span class="fox-mouth"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="led-status-text">
                    当前状态: <span id="led-status">加载中…</span>
                </div>

                <!-- 灯泡样式切换按钮 -->
                <button id="bulb-style-toggle" aria-label="选择灯泡样式">
                    <svg
                        class="bulb-style-icon"
                        viewBox="0 0 1024 1024"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M802.141549 1023.96684c-2.951567 0-5.789613-0.681131-8.514137-2.043393L511.412161 873.663947 228.175213 1021.923447c-6.130178 3.178611-13.622619 2.724524-19.29871-1.475783-5.676091-4.086786-8.400615-11.011617-7.265396-17.822926l54.149909-315.023058L26.901022 464.758342c-4.99496-4.881438-6.811309-12.146835-4.654395-18.731101 2.156915-6.584266 7.946528-11.465704 14.757837-12.4874L352.935696 388.244633 494.951497 101.602031c3.065089-6.2437 9.422311-10.216964 16.347142-10.216964s13.282053 3.973264 16.347142 10.216964L668.866929 388.244633l315.931232 45.295208c6.924831 1.021696 12.600922 5.789613 14.757837 12.4874 2.156915 6.584266 0.340565 13.849662-4.654395 18.731101L766.041609 687.488158l54.149909 315.023058c1.135218 6.811309-1.589306 13.849662-7.265396 17.936448-3.292133 2.383958-7.038353 3.519177-10.784573 3.519176z m-723.134011-559.549064l209.220719 203.544628c4.313829 4.200307 6.2437 10.216964 5.222004 16.233621l-49.495514 288.118386 258.829755-135.545056c5.335526-2.724524 11.692748-2.724524 17.028274 0l257.921581 135.431534-49.495515-288.004864c-1.021696-5.903135 0.908175-12.033313 5.222004-16.233621l209.220719-203.544628-288.685995-41.321943c-6.016657-0.908175-11.125139-4.654395-13.849662-9.98992L511.298639 150.984024 381.429674 413.105913c-2.724524 5.449047-7.833006 9.081746-13.736141 9.98992L79.007538 464.417776z"
                        />
                        <path
                            d="M81.732062 393.126072c-10.103442 0-18.277013-8.173571-18.277013-18.277014V18.277013C63.341527 8.173571 71.62862 0 81.732062 0s18.277013 8.173571 18.277014 18.277013v356.572045c0 10.103442-8.287093 18.277013-18.277014 18.277014zM255.420451 301.741005c-10.103442 0-18.277013-8.173571-18.277014-18.277014V18.277013c0-10.103442 8.173571-18.277013 18.277014-18.277013s18.277013 8.173571 18.277013 18.277013v265.186978c0 10.103442-8.173571 18.277013-18.277013 18.277014zM767.403871 301.741005c-10.103442 0-18.277013-8.173571-18.277014-18.277014V18.277013c0-10.103442 8.173571-18.277013 18.277014-18.277013 10.103442 0 18.277013 8.173571 18.277013 18.277013v265.186978c0 10.103442-8.173571 18.277013-18.277013 18.277014zM950.174005 393.126072c-10.103442 0-18.277013-8.173571-18.277013-18.277014V18.277013c0-10.103442 8.173571-18.277013 18.277013-18.277013 10.103442 0 18.277013 8.173571 18.277014 18.277013v356.572045c0.113522 10.103442-8.173571 18.277013-18.277014 18.277014z"
                        />
                    </svg>
                </button>
            </section>

            <!-- 定时任务列表 -->
            <section class="schedules-section">
                <h2 class="section-title">定时任务</h2>
                <div class="schedules-list" id="schedules-list">
                    <!-- 定时任务将通过JavaScript动态插入 -->
                    <div class="empty-state">
                        <i
                            class="ri-time-line"
                            aria-hidden="true"
                            role="img"
                            aria-label="时钟图标"
                        ></i>
                        <p>暂无定时任务，点击右上角添加</p>
                    </div>
                </div>
            </section>

            <!-- 添加/编辑定时任务模态框 -->
            <div class="modal" id="schedule-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modal-title">添加定时任务</h3>
                        <button id="close-modal-btn" aria-label="关闭">
                            <i class="ri-close-line"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="schedule-form">
                            <div class="form-group">
                                <label for="schedule-name">任务名称</label>
                                <input
                                    type="text"
                                    id="schedule-name"
                                    placeholder="请输入任务名称"
                                    required
                                />
                            </div>
                            <div class="form-group time-picker-group">
                                <div class="time-picker">
                                    <label for="start-time">执行时间</label>
                                    <input
                                        type="time"
                                        id="start-time"
                                        required
                                    />
                                </div>
                                <div class="operation-picker">
                                    <label for="operation">操作</label>
                                    <select id="operation" required>
                                        <option value="on">开灯</option>
                                        <option value="off">关灯</option>
                                        <option value="shutdown">关机</option>
                                        <option value="reboot">重启</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label id="repeat-label">重复</label>
                                <div
                                    class="repeat-days"
                                    role="group"
                                    aria-labelledby="repeat-label"
                                >
                                    <div
                                        class="day-select"
                                        data-day="0"
                                        role="checkbox"
                                        aria-checked="false"
                                        tabindex="0"
                                    >
                                        日
                                    </div>
                                    <div
                                        class="day-select"
                                        data-day="1"
                                        role="checkbox"
                                        aria-checked="false"
                                        tabindex="0"
                                    >
                                        一
                                    </div>
                                    <div
                                        class="day-select"
                                        data-day="2"
                                        role="checkbox"
                                        aria-checked="false"
                                        tabindex="0"
                                    >
                                        二
                                    </div>
                                    <div
                                        class="day-select"
                                        data-day="3"
                                        role="checkbox"
                                        aria-checked="false"
                                        tabindex="0"
                                    >
                                        三
                                    </div>
                                    <div
                                        class="day-select"
                                        data-day="4"
                                        role="checkbox"
                                        aria-checked="false"
                                        tabindex="0"
                                    >
                                        四
                                    </div>
                                    <div
                                        class="day-select"
                                        data-day="5"
                                        role="checkbox"
                                        aria-checked="false"
                                        tabindex="0"
                                    >
                                        五
                                    </div>
                                    <div
                                        class="day-select"
                                        data-day="6"
                                        role="checkbox"
                                        aria-checked="false"
                                        tabindex="0"
                                    >
                                        六
                                    </div>
                                </div>
                            </div>
                            <div class="form-group toggle-group">
                                <label for="allow-edit">允许他人编辑</label>
                                <div class="toggle-switch">
                                    <input type="checkbox" id="allow-edit" />
                                    <label
                                        for="allow-edit"
                                        class="toggle-label"
                                    ></label>
                                </div>
                            </div>
                            <div class="form-group toggle-group">
                                <label for="schedule-enabled">启用任务</label>
                                <div class="toggle-switch">
                                    <input
                                        type="checkbox"
                                        id="schedule-enabled"
                                        checked
                                    />
                                    <label
                                        for="schedule-enabled"
                                        class="toggle-label"
                                    ></label>
                                </div>
                            </div>
                            <div class="form-group toggle-group">
                                <label for="notify-via-server-chan"
                                    >Server酱通知</label
                                >
                                <div class="toggle-switch">
                                    <input
                                        type="checkbox"
                                        id="notify-via-server-chan"
                                    />
                                    <label
                                        for="notify-via-server-chan"
                                        class="toggle-label"
                                    ></label>
                                </div>
                            </div>
                            <div class="form-group toggle-group">
                                <label for="notify-via-lzc"
                                    >懒猫内置通知</label
                                >
                                <div class="notification-toggle-actions">
                                    <button
                                        type="button"
                                        class="secondary-button notification-test-button"
                                        id="test-lzc-notify-btn"
                                        aria-label="发送懒猫内置测试通知"
                                        title="发送测试通知"
                                        hidden
                                    >
                                        <i class="ri-send-plane-line"></i>
                                    </button>
                                    <div class="toggle-switch">
                                        <input
                                            type="checkbox"
                                            id="notify-via-lzc"
                                        />
                                        <label
                                            for="notify-via-lzc"
                                            class="toggle-label"
                                        ></label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button
                                    type="submit"
                                    class="primary-button"
                                    id="save-schedule-btn"
                                >
                                    保存
                                </button>
                                <button
                                    type="button"
                                    class="secondary-button"
                                    id="cancel-schedule-btn"
                                >
                                    取消
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 灯泡样式选择模态框 -->
            <div class="modal" id="bulb-style-modal">
                <div class="modal-content bulb-style-modal-content">
                    <div class="modal-header">
                        <h3>选择灯泡样式</h3>
                        <button
                            id="close-bulb-style-modal-btn"
                            aria-label="关闭"
                        >
                            <i class="ri-close-line"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="bulb-style-grid">
                            <button
                                class="bulb-style-card active"
                                data-style="classic"
                            >
                                <div class="style-preview">
                                    <div class="preview-classic-bulb"></div>
                                </div>
                                <div class="style-info">
                                    <h4 class="style-name">经典灯泡</h4>
                                    <p class="style-desc">
                                        紫色渐变灯泡，带灯丝效果
                                    </p>
                                </div>
                            </button>
                            <button class="bulb-style-card" data-style="lava">
                                <div class="style-preview">
                                    <div class="preview-lava-lamp">
                                        <div class="preview-bubble"></div>
                                    </div>
                                </div>
                                <div class="style-info">
                                    <h4 class="style-name">熔岩灯</h4>
                                    <p class="style-desc">
                                        六边形熔岩灯，浮动气泡效果
                                    </p>
                                </div>
                            </button>
                            <button
                                class="bulb-style-card"
                                data-style="vintage"
                            >
                                <div class="style-preview">
                                    <div class="preview-vintage-lamp"></div>
                                </div>
                                <div class="style-info">
                                    <h4 class="style-name">老式台灯</h4>
                                    <p class="style-desc">
                                        复古台灯，拉绳开关设计
                                    </p>
                                </div>
                            </button>
                            <button class="bulb-style-card" data-style="liquid">
                                <div class="style-preview">
                                    <div class="preview-liquid-light"></div>
                                </div>
                                <div class="style-info">
                                    <h4 class="style-name">液态光效</h4>
                                    <p class="style-desc">
                                        动态粒子动画，流动光效
                                    </p>
                                </div>
                            </button>
                            <button
                                class="bulb-style-card"
                                data-style="lightbulb"
                            >
                                <div class="style-preview">
                                    <div class="preview-lightbulb"></div>
                                </div>
                                <div class="style-info">
                                    <h4 class="style-name">灯泡开关</h4>
                                    <p class="style-desc">
                                        拨动开关样式，简洁设计
                                    </p>
                                </div>
                            </button>
                            <button class="bulb-style-card" data-style="analog">
                                <div class="style-preview">
                                    <div class="preview-analog-clock"></div>
                                </div>
                                <div class="style-info">
                                    <h4 class="style-name">点阵时钟</h4>
                                    <p class="style-desc">
                                        7×7点阵，实时显示时间
                                    </p>
                                </div>
                            </button>
                            <button class="bulb-style-card" data-style="single-led">
                                <div class="style-preview">
                                    <div class="preview-single-led"></div>
                                </div>
                                <div class="style-info">
                                    <h4 class="style-name">Single LED</h4>
                                    <p class="style-desc">
                                        表情灯泡，可爱设计
                                    </p>
                                </div>
                            </button>
                            <button class="bulb-style-card" data-style="neon-switch">
                                <div class="style-preview">
                                    <div class="preview-neon-switch"></div>
                                </div>
                                <div class="style-info">
                                    <h4 class="style-name">霓虹开关</h4>
                                    <p class="style-desc">
                                        霓虹灯效果，科技感设计
                                    </p>
                                </div>
                            </button>
                            <button class="bulb-style-card" data-style="fox-daynight">
                                <div class="style-preview">
                                    <div class="preview-fox-daynight"></div>
                                </div>
                                <div class="style-info">
                                    <h4 class="style-name">狐狸日夜灯</h4>
                                    <p class="style-desc">
                                        日夜切换，可爱狐狸设计
                                    </p>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast通知容器 -->
        <div
            class="toast-container"
            id="toast-container"
            aria-live="polite"
            aria-atomic="true"
        ></div>

        <script src="/static/js/app.js"></script>
    </body>
</html>
