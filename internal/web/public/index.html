<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#514878">
    <title>懒猫关灯</title>
    <link rel="stylesheet" href="/static/css/normalize-5.0.0.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 添加图标库 -->
    <link rel="stylesheet" href="/static/css/remixicon.css">
</head>
<body>
    <!-- 动效背景容器 -->
    <div class="background-container">
        <div class="background-1"></div>
        <div class="background-2"></div>
    </div>
    
    <div id="app">
        <!-- 顶部导航栏 -->
        <header class="app-header">
            <div class="header-title">懒猫关灯</div>
            <div class="header-actions">
                <button id="theme-toggle" aria-label="切换主题">

                    </svg>
                    <!-- 明亮主题图标 -->
                    <svg id="light-icon" t="1755228625494" class="icon theme-icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="10333" width="24" height="24" style="display: none;" aria-hidden="true" focusable="false">
                        <path d="M512 192c179.2 0 320 140.8 320 320s-140.8 320-320 320-320-140.8-320-320S332.8 192 512 192M512 128C300.8 128 128 300.8 128 512s172.8 384 384 384 384-172.8 384-384S723.2 128 512 128L512 128z" fill="currentColor" p-id="10334"></path>
                        <path d="M544 416l236.8 0C774.4 403.2 768 384 761.6 371.2L544 371.2 544 416z" fill="currentColor" p-id="10335"></path>
                        <path d="M544 608l0 44.8 217.6 0c6.4-12.8 12.8-32 19.2-44.8L544 608z" fill="currentColor" p-id="10336"></path>
                        <path d="M544 723.2 544 768 640 768c25.6-12.8 44.8-25.6 64-44.8L544 723.2z" fill="currentColor" p-id="10337"></path>
                        <path d="M800 492.8l-256 0 0 44.8 256 0c0-6.4 0-12.8 0-25.6S800 499.2 800 492.8z" fill="currentColor" p-id="10338"></path>
                        <path d="M544 300.8 704 300.8c-19.2-19.2-38.4-32-64-44.8L544 256 544 300.8z" fill="currentColor" p-id="10339"></path>
                    </svg>
                </button>
                <a href="/config.html" aria-label="配置">
                    <svg t="1757391383098" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="5366" width="24" height="24" aria-hidden="true" focusable="false">

                    </svg>
                </a>
                <button id="add-schedule-btn" aria-label="添加定时任务">
                    <i class="ri-add-line"></i>
                </button>
            </div>
        </header>

        <!-- 用户信息区域 -->
        <section class="user-info-section">
            <div class="user-profile">
                <div class="user-avatar">
                    <i class="ri-user-3-line" aria-hidden="true" role="img" aria-label="用户头像"></i>
                </div>
                <div class="user-details">
                    <div class="user-name">加载中…</div>
                    <div class="user-role">角色: 加载中…</div>
                </div>
                <div class="user-actions">
                    <button id="logout-btn" aria-label="登出" title="退出登录" class="logout-button">
                        <i class="ri-logout-circle-r-line"></i>
                        <span>退出</span>
                    </button>
                </div>
            </div>
            <div class="device-info">
                <div class="device-id">设备ID: 加载中…</div>
                <div class="device-version">版本: 加载中…</div>
            </div>
        </section>

        <!-- LED当前状态展示 -->
        <section class="led-status-section">
            <div class="switch">
                <input type="checkbox" name="toggle" id="led-toggle">
                <label for="led-toggle">
                    <i class="bulb">
                        <span class="bulb-center"></span>
                        <span class="filament-1"></span>
                        <span class="filament-2"></span>
                        <span class="reflections">
                            <span></span>
                        </span>
                        <span class="sparks">
                            <i class="spark1"></i>
                            <i class="spark2"></i>
                            <i class="spark3"></i>
                            <i class="spark4"></i>
                        </span>
                    </i>
                </label>
            </div>
            <div class="led-status-text">当前状态: <span id="led-status">加载中…</span></div>
        </section>

        <!-- 定时任务列表 -->
        <section class="schedules-section">
            <h2 class="section-title">定时任务</h2>
            <div class="schedules-list" id="schedules-list">
                <!-- 定时任务将通过JavaScript动态插入 -->
                <div class="empty-state">
                    <i class="ri-time-line" aria-hidden="true" role="img" aria-label="时钟图标"></i>
                    <p>暂无定时任务，点击右上角添加</p>
                </div>
            </div>
        </section>

        <!-- 添加/编辑定时任务模态框 -->
        <div class="modal" id="schedule-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title">添加定时任务</h3>
                    <button id="close-modal-btn" aria-label="关闭">
                        <i class="ri-close-line"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="schedule-form">
                        <div class="form-group">
                            <label for="schedule-name">任务名称</label>
                            <input type="text" id="schedule-name" placeholder="请输入任务名称" required>
                        </div>
                        <div class="form-group time-picker-group">
                            <div class="time-picker">
                                <label for="start-time">执行时间</label>
                                <input type="time" id="start-time" required>
                            </div>
                            <div class="operation-picker">
                                <label for="operation">操作</label>
                                <select id="operation" required>
                                    <option value="on">开灯</option>
                                    <option value="off">关灯</option>
                                    <option value="shutdown">关机</option>
                                    <option value="reboot">重启</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label id="repeat-label">重复</label>
                            <div class="repeat-days" role="group" aria-labelledby="repeat-label">
                                <div class="day-select" data-day="0" role="checkbox" aria-checked="false" tabindex="0">日</div>
                                <div class="day-select" data-day="1" role="checkbox" aria-checked="false" tabindex="0">一</div>
                                <div class="day-select" data-day="2" role="checkbox" aria-checked="false" tabindex="0">二</div>
                                <div class="day-select" data-day="3" role="checkbox" aria-checked="false" tabindex="0">三</div>
                                <div class="day-select" data-day="4" role="checkbox" aria-checked="false" tabindex="0">四</div>
                                <div class="day-select" data-day="5" role="checkbox" aria-checked="false" tabindex="0">五</div>
                                <div class="day-select" data-day="6" role="checkbox" aria-checked="false" tabindex="0">六</div>
                            </div>
                        </div>
                        <div class="form-group toggle-group">
                            <label for="allow-edit">允许他人编辑</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="allow-edit">
                                <label for="allow-edit" class="toggle-label"></label>
                            </div>
                        </div>
                        <div class="form-group toggle-group">
                            <label for="schedule-enabled">启用任务</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="schedule-enabled" checked>
                                <label for="schedule-enabled" class="toggle-label"></label>
                            </div>
                        </div>
                        <div class="form-group toggle-group">
                            <label for="notify-via-server-chan">Server酱通知</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="notify-via-server-chan">
                                <label for="notify-via-server-chan" class="toggle-label"></label>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="primary-button" id="save-schedule-btn">保存</button>
                            <button type="button" class="secondary-button" id="cancel-schedule-btn">取消</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast通知容器 -->
    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
