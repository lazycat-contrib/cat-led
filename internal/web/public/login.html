<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 懒猫关灯</title>
    <link rel="stylesheet" href="/static/css/normalize-5.0.0.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/remixicon.css">
    <style>
        .login-page {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .login-page::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 149, 0, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(81, 72, 120, 0.2) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(138, 127, 177, 0.1) 0%, transparent 70%);
            animation: loginBgFloat 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes loginBgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, -2%) rotate(1deg); }
            66% { transform: translate(-1%, 1%) rotate(-0.5deg); }
        }

        [data-theme="dark"] .login-page::before {
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 149, 0, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(81, 72, 120, 0.12) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(138, 127, 177, 0.06) 0%, transparent 70%);
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25),
                        0 8px 32px rgba(0, 0, 0, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 32px 100px rgba(0, 0, 0, 0.3),
                        0 12px 40px rgba(0, 0, 0, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        [data-theme="light"] .login-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.08),
                        0 8px 32px rgba(0, 0, 0, 0.04),
                        inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .login-logo {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            background: rgba(255, 149, 0, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 149, 0, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #FF9F0A;
            box-shadow: 0 8px 32px rgba(255, 149, 0, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-logo:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(255, 149, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        [data-theme="light"] .login-logo {
            background: rgba(255, 149, 0, 0.1);
            border-color: rgba(255, 149, 0, 0.2);
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--header-text-color);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        [data-theme="light"] .login-subtitle {
            color: var(--text-secondary);
        }

        .login-button {
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, rgba(255, 149, 0, 0.9) 0%, rgba(255, 120, 0, 0.9) 100%);
            border: 1px solid rgba(255, 149, 0, 0.3);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(255, 149, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.5s ease;
        }

        .login-button:hover::before {
            left: 100%;
        }

        .login-button:hover {
            background: linear-gradient(135deg, rgba(255, 160, 20, 1) 0%, rgba(255, 130, 10, 1) 100%);
            border-color: rgba(255, 149, 0, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(255, 149, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 12px rgba(255, 149, 0, 0.3);
        }

        .login-button i {
            font-size: 20px;
        }

        .login-button--disabled {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            color: var(--text-tertiary);
            box-shadow: none;
        }

        .login-button--disabled:hover {
            transform: none;
            box-shadow: none;
        }

        [data-theme="light"] .login-button--disabled {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.08);
            color: var(--text-tertiary);
        }

        .login-footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            color: var(--text-tertiary);
            line-height: 1.6;
        }

        [data-theme="light"] .login-footer {
            border-top-color: rgba(0, 0, 0, 0.06);
        }

        .loading {
            display: none;
        }

        .loading.show {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.2);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 20px;
            color: #FF453A;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .error-message i {
            font-size: 18px;
            flex-shrink: 0;
        }

        .error-message.show {
            display: flex;
        }

        [data-theme="light"] .error-message {
            background: rgba(255, 59, 48, 0.06);
            border-color: rgba(255, 59, 48, 0.15);
            color: #D70015;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <i class="ri-lightbulb-flash-line"></i>
            </div>
            
            <h1 class="login-title">懒猫关灯</h1>
            <p class="login-subtitle">请使用您的账户登录以继续</p>
            
            <div id="error-message" class="error-message">
                <i class="ri-error-warning-line"></i>
                <span id="error-text">登录失败，请重试</span>
            </div>
            
            {{if .OIDCAvailable}}
            <a href="{{.OIDCLoginURL}}" class="login-button" id="login-btn">
                <i class="ri-login-circle-line"></i>
                <span id="login-text">使用 OIDC 登录</span>
                <i class="ri-loader-4-line loading" id="loading-icon"></i>
            </a>
            {{else}}
            <div class="login-button login-button--disabled">
                <i class="ri-error-warning-line"></i>
                <span>OIDC 未配置</span>
            </div>
            {{end}}
            
            <div class="login-footer">
                {{if .OIDCAvailable}}
                <p>通过 OIDC 统一身份认证系统登录</p>
                <p>安全、便捷、统一管理</p>
                {{else}}
                <p>OIDC 认证未配置</p>
                <p>请联系管理员配置认证系统或使用 Header 认证</p>
                {{end}}
            </div>
        </div>
    </div>

    <script>
        let currentTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);

        const loginBtn = document.getElementById('login-btn');
        if (loginBtn) {
            loginBtn.addEventListener('click', function(e) {
                const loginText = document.getElementById('login-text');
                const loadingIcon = document.getElementById('loading-icon');
                const errorMessage = document.getElementById('error-message');
                
                errorMessage.classList.remove('show');
                loginText.textContent = '正在跳转…';
                loadingIcon.classList.add('show');
                loginBtn.style.pointerEvents = 'none';
                
                setTimeout(() => {
                    if (loginBtn.style.pointerEvents === 'none') {
                        loginText.textContent = '使用 OIDC 登录';
                        loadingIcon.classList.remove('show');
                        loginBtn.style.pointerEvents = 'auto';
                        
                        document.getElementById('error-text').textContent = '登录超时，请检查网络连接或重试';
                        errorMessage.classList.add('show');
                    }
                }, 5000);
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorMessage = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            
            switch (error) {
                case 'access_denied':
                    errorText.textContent = '访问被拒绝，请检查您的权限';
                    break;
                case 'invalid_request':
                    errorText.textContent = '请求无效，请重试';
                    break;
                case 'server_error':
                    errorText.textContent = '服务器错误，请稍后重试';
                    break;
                case 'oidc_not_configured':
                    errorText.textContent = 'OIDC认证未配置，请联系管理员或使用Header认证';
                    const loginButton = document.getElementById('login-btn');
                    if (loginButton) {
                        loginButton.style.display = 'none';
                    }
                    break;
                default:
                    errorText.textContent = '登录失败: ' + error;
            }
            
            errorMessage.classList.add('show');
        }
    </script>
</body>
</html>
